<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E24" />
      <stop offset="100%" stop-color="#121216" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#2D2D38" stroke-width="4" />

  <!-- Notebook Body -->
  <g filter="url(#shadow)">
    <!-- Notebook Cover -->
    <rect x="110" y="86" width="292" height="340" rx="28" fill="#252530" stroke="#3F3F50" stroke-width="4" />
    
    <!-- Spine binding -->
    <path d="M 110 114 Q 110 86 138 86 L 160 86 L 160 426 L 138 426 Q 110 426 110 398 Z" fill="#1C1C24" />
    <line x1="160" y1="86" x2="160" y2="426" stroke="#D97706" stroke-width="3" stroke-dasharray="8 6" />

    <!-- Bookmark Ribbon hanging down -->
    <path d="M 310 86 L 310 170 L 330 150 L 350 170 L 350 86 Z" fill="url(#goldGrad)" />

    <!-- Notebook Lined Details -->
    <line x1="184" y1="170" x2="280" y2="170" stroke="#4B4B5E" stroke-width="8" stroke-linecap="round" />
    <line x1="184" y1="210" x2="360" y2="210" stroke="#3D3D4E" stroke-width="6" stroke-linecap="round" />
    <line x1="184" y1="246" x2="340" y2="246" stroke="#3D3D4E" stroke-width="6" stroke-linecap="round" />
    <line x1="184" y1="282" x2="360" y2="282" stroke="#3D3D4E" stroke-width="6" stroke-linecap="round" />

    <!-- Stylized "R" Monogram Stamp in Gold -->
    <g transform="translate(230, 310)">
      <circle cx="46" cy="46" r="42" fill="#1E1E26" stroke="#F59E0B" stroke-width="3" />
      <text x="46" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="url(#goldGrad)" text-anchor="middle">R</text>
    </g>
  </g>
</svg>
