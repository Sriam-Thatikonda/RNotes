[package]
name = "rnotes-desktop"
version = "1.0.0"
description = "RNotes Desktop Application"
authors = ["Baverika"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-sql = { version = "2.4", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
